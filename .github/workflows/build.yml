name: Build PDF Studio Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create project structure
        run: |
          mkdir -p ".github/workflows" "app" "app/src" "app/src/main" "app/src/main/java" "app/src/main/java/com" "app/src/main/java/com/pdfstudio" "app/src/main/java/com/pdfstudio/app" "app/src/main/java/com/pdfstudio/app/model" "app/src/main/java/com/pdfstudio/app/ui" "app/src/main/java/com/pdfstudio/app/utils" "app/src/main/res" "app/src/main/res/drawable" "app/src/main/res/layout" "app/src/main/res/mipmap-anydpi-v26" "app/src/main/res/values" "app/src/main/res/menu" "app/src/main/res/xml" "gradle" "gradle/wrapper"

      - name: Write project files from base64
        run: |
          echo '' | base64 -d > "app/build.gradle"
          echo '' | base64 -d > "app/proguard-rules.pro"
          echo '' | base64 -d > "app/src/main/AndroidManifest.xml"
          echo '' | base64 -d > "app/src/main/java/com/pdfstudio/app/model/ExportFormat.kt"
          echo '' | base64 -d > "app/src/main/java/com/pdfstudio/app/ui/MainActivity.kt"
          echo '' | base64 -d > "app/src/main/java/com/pdfstudio/app/ui/PageThumbnailAdapter.kt"
          echo '' | base64 -d > "app/src/main/java/com/pdfstudio/app/ui/ViewerActivity.kt"
          echo '' | base64 -d > "app/src/main/java/com/pdfstudio/app/utils/PdfToolsHelper.kt"
          echo '' | base64 -d > "app/src/main/res/drawable/ic_launcher_foreground.xml"
          echo '' | base64 -d > "app/src/main/res/layout/activity_main.xml"
          echo '' | base64 -d > "app/src/main/res/layout/activity_viewer.xml"
          echo '' | base64 -d > "app/src/main/res/layout/dialog_progress.xml"
          echo '' | base64 -d > "app/src/main/res/layout/dialog_split.xml"
          echo '' | base64 -d > "app/src/main/res/layout/dialog_watermark.xml"
          echo '' | base64 -d > "app/src/main/res/layout/item_page_thumb.xml"
          echo '' | base64 -d > "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
          echo '' | base64 -d > "app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml"
          echo '' | base64 -d > "app/src/main/res/values/colors.xml"
          echo 'PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHJlc291cmNlcz4KICAgIDxzdHJpbmcgbmFtZT0iYXBwX25hbWUiPlBERiBTdHVkaW88L3N0cmluZz4KPC9yZXNvdXJjZXM+Cg==' | base64 -d > "app/src/main/res/values/strings.xml"
          echo '' | base64 -d > "app/src/main/res/values/themes.xml"
          echo 'PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHBhdGhzPgogICAgPGNhY2hlLXBhdGggbmFtZT0iY2FjaGUiIHBhdGg9Ii4iIC8+CiAgICA8ZXh0ZXJuYWwtcGF0aCBuYW1lPSJleHRlcm5hbCIgcGF0aD0iLiIgLz4KICAgIDxmaWxlcy1wYXRoIG5hbWU9ImZpbGVzIiBwYXRoPSIuIiAvPgo8L3BhdGhzPgo=' | base64 -d > "app/src/main/res/xml/file_paths.xml"
          echo '' | base64 -d > "build.gradle"
          echo 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmFuZHJvaWQuZW5hYmxlSmV0aWZpZXI9dHJ1ZQprb3RsaW4uY29kZS5zdHlsZT1vZmZpY2lhbAo=' | base64 -d > "gradle.properties"
          echo 'ZGlzdHJpYnV0aW9uQmFzZT1HUkFETEVfVVNFUl9IT01FCmRpc3RyaWJ1dGlvblBhdGg9d3JhcHBlci9kaXN0cwp6aXBTdG9yZUJhc2U9R1JBRExFX1VTRVJfSE9NRQp6aXBTdG9yZVBhdGg9d3JhcHBlci9kaXN0cwpkaXN0cmlidXRpb25Vcmw9aHR0cHNcOi8vc2VydmljZXMuZ3JhZGxlLm9yZy9kaXN0cmlidXRpb25zL2dyYWRsZS04LjQtYmluLnppcAo=' | base64 -d > "gradle/wrapper/gradle-wrapper.properties"
          echo '' | base64 -d > "gradlew"
          echo 'cm9vdFByb2plY3QubmFtZSA9ICJQREZTdHVkaW8iCmluY2x1ZGUgJzphcHAnCg==' | base64 -d > "settings.gradle"
          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "APK found: $APK_PATH"
          ls -lh "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release on main push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "PDF Studio - Build ${{ github.run_number }}"
          body: |
            Automated build from commit ${{ github.sha }}
            Install the APK directly on your Android device (Android 8.0+).
            Enable "Install from unknown sources" in your device settings before installing.
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print summary
        run: |
          echo "========================================="
          echo " PDF Studio Android build complete"
          echo "========================================="
          echo " APK: ${{ env.APK_PATH }}"
          echo " Build: ${{ github.run_number }}"
          echo " Commit: ${{ github.sha }}"
          echo "========================================="
